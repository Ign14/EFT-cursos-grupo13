name: CI-CD EFT S9

# Despliegue automatizado al hacer push a la rama principal.
# Asume que la RAIZ del repositorio es este proyecto (EFT_S9_Grupo13).
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push imagenes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [cursos-service, bff-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/eft-${{ matrix.service }}:latest

  deploy-ec2:
    name: Deploy a EC2 (docker compose)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Iniciar instancia EC2 si está detenida
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "Estado actual de la instancia: $STATE"
          if [ "$STATE" = "stopped" ]; then
            echo "La instancia está detenida. Iniciando..."
            aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
          fi
          echo "Esperando a que la instancia esté en estado 'running'..."
          aws ec2 wait instance-running --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
          echo "Esperando a que el puerto SSH (22) esté disponible..."
          for i in $(seq 1 20); do
            if nc -zw5 ${{ secrets.EC2_HOST }} 22; then
              echo "SSH disponible."
              break
            fi
            echo "Intento $i/20: SSH no disponible aún. Reintentando en 10s..."
            sleep 10
          done

      - name: Desplegar via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            U="${{ secrets.DOCKERHUB_USERNAME }}"
            # Swap para el t3.micro (idempotente): evita OOM con 2 JVMs + rabbitmq
            if ! sudo swapon --show | grep -q /swapfile; then
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
            fi
            mkdir -p ~/eft && cd ~/eft
            cat > docker-compose.yml <<COMPOSE
            services:
              rabbitmq:
                image: rabbitmq:3-management
                container_name: eft-rabbitmq
                ports: ["5672:5672","15672:15672"]
                environment:
                  RABBITMQ_DEFAULT_USER: guest
                  RABBITMQ_DEFAULT_PASS: guest
                healthcheck:
                  test: ["CMD","rabbitmq-diagnostics","-q","ping"]
                  interval: 15s
                  timeout: 10s
                  retries: 5
                mem_limit: 350m
              cursos-service:
                image: ${U}/eft-cursos-service:latest
                container_name: eft-cursos-service
                ports: ["8081:8081"]
                mem_limit: 480m
                environment:
                  JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
                  AZURE_B2C_ISSUER: "${{ secrets.AZURE_B2C_ISSUER }}"
                  AZURE_B2C_JWK_SET_URI: "${{ secrets.AZURE_B2C_JWK_SET_URI }}"
                  AZURE_B2C_ROLES_CLAIM: "extension_Role"
                  AWS_REGION: us-east-1
                  AWS_S3_BUCKET: "${{ secrets.AWS_S3_BUCKET }}"
              bff-service:
                image: ${U}/eft-bff-service:latest
                container_name: eft-bff-service
                depends_on:
                  rabbitmq:
                    condition: service_healthy
                ports: ["8082:8082"]
                mem_limit: 480m
                environment:
                  JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
                  RABBITMQ_HOST: rabbitmq
                  AZURE_B2C_ISSUER: "${{ secrets.AZURE_B2C_ISSUER }}"
                  AZURE_B2C_JWK_SET_URI: "${{ secrets.AZURE_B2C_JWK_SET_URI }}"
                  AZURE_B2C_ROLES_CLAIM: "extension_Role"
              frontend:
                image: ${U}/eft-frontend:latest
                container_name: eft-frontend
                ports: ["8080:80"]
            COMPOSE
            docker compose pull
            docker compose up -d
            docker image prune -f
